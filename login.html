<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Ibu Kos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-page">
    <div class="login-box">
      <div class="card">
        <div class="head">
          <div class="logo">🏠</div>
          <h1>Login Ibu Kos</h1>
          <p style="color: var(--muted); font-size: 14px">Masuk untuk mengelola data kos Anda</p>
        </div>

        <!-- Nanti action diarahkan ke proses_login.php dengan method POST -->
        <form action="dashboard.html">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Masukkan username" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Masukkan password" required />
          </div>
          <button type="submit" class="btn btn-block">Masuk</button>
        </form>

        <p class="back"><a href="index.html">&larr; Kembali ke halaman informasi kos</a></p>
      </div>
    </div>
  </body>
</html>
